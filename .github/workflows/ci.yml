name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/KksDllStringExtractor/KksDllStringExtractor.csproj
      - name: Build
        run: dotnet build src/KksDllStringExtractor/KksDllStringExtractor.csproj --configuration Release --no-restore
      - name: Self-test (including managed assembly extraction)
        run: dotnet run --project src/KksDllStringExtractor/KksDllStringExtractor.csproj --configuration Release --no-build -- --self-test
