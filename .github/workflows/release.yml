name: Windows and Linux Release

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "*.sln"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.targets"

    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/KksDllStringExtractor/KksDllStringExtractor.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishTrimmed=false `
            -o dist/win-x64

      - name: Self test
        shell: pwsh
        run: |
          ./dist/win-x64/KKS_DLL_String_Extractor.exe --self-test

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: KKS-DLL-String-Extractor-win-x64
          path: dist/win-x64
          retention-days: 14


  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Publish Linux x64
        run: |
          dotnet publish src/KksDllStringExtractor/KksDllStringExtractor.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o dist/linux-x64

      - name: Self test
        run: |
          chmod +x dist/linux-x64/KKS_DLL_String_Extractor
          ./dist/linux-x64/KKS_DLL_String_Extractor --self-test

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: KKS-DLL-String-Extractor-linux-x64
          path: dist/linux-x64
          retention-days: 14


  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-linux

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v6
        with:
          name: KKS-DLL-String-Extractor-win-x64
          path: win-x64


      - name: Download Linux build
        uses: actions/download-artifact@v6
        with:
          name: KKS-DLL-String-Extractor-linux-x64
          path: linux-x64


      - name: Package archives
        run: |
          chmod +x linux-x64/KKS_DLL_String_Extractor

          mkdir release

          cd win-x64
          zip -r ../release/KKS-DLL-String-Extractor-win-x64.zip .

          cd ../linux-x64
          zip -r ../release/KKS-DLL-String-Extractor-linux-x64.zip .


      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/KKS-DLL-String-Extractor-win-x64.zip
            release/KKS-DLL-String-Extractor-linux-x64.zip

          generate_release_notes: true

          draft: false

          prerelease: false
